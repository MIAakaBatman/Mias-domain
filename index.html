<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WELCOME TO MIA'S PLANET</title>

  <style>
    /* Page base */
    body {
      background-color: #0b0d17;
      color: #ffffff;
      min-height: 100vh;
      margin: 0;
      font-family: sans-serif;
      box-shadow: inset 0 0 90px rgba(180, 140, 255, 0.49);

      /* Layout: natural vertical scroll */
      display: flex;
      flex-direction: column;
      align-items: center;
      overflow-x: hidden;
    }

    /* Card frame */
    .card-container {
      position: relative;
      background-image: url('https://i.postimg.cc/nVKyPdh3/IMG-0836.png');
      background-size: 100% 100%;
      background-repeat: no-repeat;
      background-position: center;

      width: 440px;
      height: 320px;
      padding: 60px 45px 40px 55px;
      box-sizing: border-box;
      text-align: center;

      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      margin-top: 100px;
    }

    .doodle {
      position: absolute;
      pointer-events: none;
    }

    /* Star doodles */
    .star-1 { width: 80px; top: 20px; left: -110px; transform: rotate(-12deg); }
    .star-2 { width: 49px; bottom: 25px; left: -40px; transform: rotate(8deg); }
    .star-3 { width: 72px; bottom: -45px; left: 40px; transform: rotate(-5deg); }
    .star-4 { width: 55px; top: -35px; right: -50px; transform: rotate(15deg); }
    .star-5 { width: 45px; top: 75px; right: -110px; transform: rotate(-10deg); }
    .star-6 { width: 80px; bottom: -30px; right: -70px; transform: rotate(20deg); }
    .star-7 { width: 58px; top: -40px; left: 10px; transform: rotate(5deg); }
    .star-8 { width: 62px; top: 120px; left: -130px; transform: rotate(-18deg); }
    .star-9 { width: 49px; bottom: -50px; right: 20px; transform: rotate(12deg); }
    .star-10{ width: 50px; top: -20px; right: -120px; transform: rotate(-8deg); }

    /* Hero / cloud / intro layout */
    .hero-section {
      min-height: 200vh;
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      box-sizing: border-box;
    }

    .cloud-section {
      width: 100%;
      position: relative;
      line-height: 0;
    }

    .cloud-overlay {
      width: 100%;
      height: auto;
      display: block;
      object-fit: cover;
    }

    .intro-container {
      padding: 40px 20px 100px;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
      z-index: 1;
    }

    .intro-heading {
      font-family: "Party LET Plain", "Party LET", "Brush Script MT", cursive;
      font-size: 2.5rem;
      color: #FFFC8F;
      margin-bottom: 30px;

      display: inline-block;
      border: 2px solid #87ceeb;
      background-color: #87ceeb;
      border-radius: 15px;
      padding: 8px 24px;
      box-shadow: 0 0 12px rgba(135, 206, 235, 0.4);
    }

    .intro-content {
      display: flex;
      flex-direction: row;
      align-items: center;
      justify-content: center;
      gap: 40px;
      width: 90%;
      max-width: 900px;
      margin: 0 auto;
    }

    .text-block {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      flex: 1;
      text-align: left;
    }

    .intro-text {
      font-family: sans-serif;
      color: #FFE75E;
      font-size: 1.1rem;
      line-height: 1.6;
      margin: 0;
    }

    .profile-pic {
      width: 500px;
      height: auto;
    }

    /* Intro background starfield (behind content) */
    .intro-container::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: -1;
      background-image: 
        radial-gradient(2px 2px at 20px 30px, #ffffff, rgba(0,0,0,0)),
        radial-gradient(2px 2px at 40px 70px, rgba(255,255,255,0.8), rgba(0,0,0,0)),
        radial-gradient(1px 1px at 90px 40px, #ffffff, rgba(0,0,0,0)),
        radial-gradient(2px 2px at 160px 120px, rgba(255,255,255,0.9), rgba(0,0,0,0)),
        radial-gradient(1.5px 1.5px at 230px 10px, #ffffff, rgba(0,0,0,0));
      background-repeat: repeat;
      background-size: 250px 250px;
      animation: starTwinkle 3s ease-in-out infinite alternate;
    }

    @keyframes starTwinkle {
      0% { opacity: 0.2; }
      100% { opacity: 0.8; }
    }

    /* Aura glow for profile PNGs */
    .aura-glow {
      animation: dbzAura 0.8s ease-in-out infinite alternate;
      will-change: filter;
    }

    @keyframes dbzAura {
      0% {
        filter:
          drop-shadow(0 0 6px rgba(135, 206, 235, 0.8))
          drop-shadow(0 0 15px rgba(180, 140, 255, 0.6))
          drop-shadow(0 0 25px rgba(135, 206, 235, 0.4));
        transform: scale(1);
      }
      100% {
        filter:
          drop-shadow(0 0 12px rgba(135, 206, 235, 1))
          drop-shadow(0 0 28px rgba(180, 140, 255, 0.9))
          drop-shadow(0 0 45px rgba(255, 255, 255, 0.7));
        transform: scale(1.015);
      }
    }

    /* Interactive reveal line */
    .secret-container {
      margin-top: 15px;
      display: flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
    }

    .secret-toggle {
      display: none;
    }

    .celestial-prop {
      font-size: 7rem;
      transition: transform 0.5s ease, filter 0.5s ease;
      user-select: none;
    }

    .celestial-prop::before {
      content: "☀️";
      filter: drop-shadow(0 0 8px #ffb703);
    }

    .secret-fact {
      opacity: 0;
      transform: translateX(-15px) scale(0.9);
      font-size: 1.8rem;
      transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      color: #a0c4ff;
      font-weight: bold;
    }

    /* Reveal states */
    .secret-toggle:checked + .celestial-prop::before {
      content: "🌙";
      filter: drop-shadow(0 0 12px #e0aaff);
    }

    .secret-toggle:checked + .celestial-prop {
      transform: rotate(360deg) scale(1.2);
    }

    .secret-toggle:checked ~ .secret-fact {
      opacity: 1;
      transform: translateX(0) scale(1);
    }

    /* Typography within card */
    h1 {
      font-family: "Party LET Plain", "Party LET", "Brush Script MT", cursive;
      font-size: 2.2rem;
      color: #ffffff;
      margin: 0 0 10px 0;
      line-height: 1.2;
    }

    p {
      font-family: sans-serif;
      font-size: 0.95rem;
      color: #d1d5db;
      margin: 0;
    }

    /* Small responsive tweaks */
    @media (max-width: 900px) {
      .intro-content { flex-direction: column-reverse; gap: 20px; }
      .profile-pic { width: 320px; }
      .card-container { width: 90%; height: auto; padding: 50px 30px; }
    }
  </style>
</head>

<body>

  <div class="card-container" role="region" aria-label="Welcome card">
    <!-- STAR DOODLES -->
    <img src="https://i.postimg.cc/7ZV7FX61/IMG-0843.png" class="doodle star-1" alt="" aria-hidden="true">
    <img src="https://i.postimg.cc/7ZV7FX61/IMG-0843.png" class="doodle star-2" alt="" aria-hidden="true">
    <img src="https://i.postimg.cc/7ZV7FX61/IMG-0843.png" class="doodle star-3" alt="" aria-hidden="true">
    <img src="https://i.postimg.cc/7ZV7FX61/IMG-0843.png" class="doodle star-4" alt="" aria-hidden="true">
    <img src="https://i.postimg.cc/7ZV7FX61/IMG-0843.png" class="doodle star-5" alt="" aria-hidden="true">
    <img src="https://i.postimg.cc/7ZV7FX61/IMG-0843.png" class="doodle star-6" alt="" aria-hidden="true">
    <img src="https://i.postimg.cc/7ZV7FX61/IMG-0843.png" class="doodle star-7" alt="" aria-hidden="true">
    <img src="https://i.postimg.cc/7ZV7FX61/IMG-0843.png" class="doodle star-8" alt="" aria-hidden="true">
    <img src="https://i.postimg.cc/7ZV7FX61/IMG-0843.png" class="doodle star-9" alt="" aria-hidden="true">
    <img src="https://i.postimg.cc/7ZV7FX61/IMG-0843.png" class="doodle star-10" alt="" aria-hidden="true">

    <h1>WELCOME TO MIA'S PLANET</h1>
    <p>~prepare to be starstruck~</p>
  </div>

  <!-- Full-width clouds -->
  <div class="cloud-section" aria-hidden="true">
    <img src="https://i.postimg.cc/mD2jDw8Z/IMG-0854.png" class="cloud-overlay" alt="Clouds overlay">
  </div>

  <!-- Introduction -->
  <div class="intro-container">
    <h2 class="intro-heading">INTRODUCTION</h2>

    <div class="intro-content">
      <img src="https://i.postimg.cc/qvVSbsDD/IMG-0845.png" class="profile-pic aura-glow" alt="Mia">

      <div class="text-block">
        <p class="intro-text">
          Welcome! Woah ....<br>
          you made it this far ....<br><br>
          well now that u are here ... here are a few facts abt me ...<br>one of em is ...
        </p>

        <label class="secret-container" title="Click to reveal the secret">
          <input type="checkbox" class="secret-toggle" aria-hidden="true">
          <span class="celestial-prop" aria-hidden="true"></span>
          <span class="secret-fact" aria-live="polite">IM BATMAN!!! 🦇</span>
        </label>

        <p class="intro-text" style="margin-top: 10px;">
          i bet u didnt know that
        </p>
      </div>
    </div>

    <!-- Audio (relative path) -->
    <!-- Ensure dunnndunn.wav exists at the same directory as index.html, or replace with a hosted URL -->
    <audio id="bg-sound" src="I'm batman, I live in the shadows, justice sound effect.mp3" hidden></audio>
  </div>

  <script>
    <script>
  const celestialToggle = document.querySelector('.secret-toggle');
  const bgSound = document.getElementById('bg-sound');

  celestialToggle.addEventListener('change', () => {
    if (celestialToggle.checked) {
      bgSound.currentTime = 0; // Starts from the beginning
      bgSound.play().catch(e => console.log("Audio play blocked:", e));
    }
  });
</script>

  </script>
</body>
</html>
