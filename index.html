  <style>
    body {
      background-color: #0b0d17;
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      font-family: sans-serif;
      box-shadow: inset 0 0 90px rgba(180, 140, 255, 0.49);
    }

    .card-container {
      position: relative;

      /* 1. PUT YOUR PURPLE FRAME IMAGE LINK HERE */
      background-image: url('https://i.postimg.cc/nVKyPdh3/IMG-0836.png');
      background-size: 100% 100%;
      background-repeat: no-repeat;
      background-position: center;

      width: 440px;
      height: 320px;
      padding: 60px 45px 40px 55px;
      box-sizing: border-box;
      text-align: center;

      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    .doodle {
      position: absolute;
      pointer-events: none;
    }

    /* Smaller star dimensions & scattered positions */
    .star-1 {
      width: 80px;
      top: 20px;
      left: -110px;
      transform: rotate(-12deg);
    }

    .star-2 {
      width: 49px;
      bottom: 25px;
      left: -40px;
      transform: rotate(8deg);
    }

    .star-3 {
      width: 72px;
      bottom: -45px;
      left: 40px;
      transform: rotate(-5deg);
    }

    .star-4 {
      width: 55px;
      top: -35px;
      right: -50px;
      transform: rotate(15deg);
    }

    .star-5 {
      width: 45px;
      top: 75px;
      right: -110px;
      transform: rotate(-10deg);
    }

    .star-6 {
      width: 80px;
      bottom: -30px;
      right: -70px;
      transform: rotate(20deg);
    }
/* Change sizes here by adjusting the 'width' numbers */
.star-7  { width: 58px; top: -40px; left: 10px; transform: rotate(5deg); }
.star-8  { width: 62px; top: 120px; left: -130px; transform: rotate(-18deg); }
.star-9  { width: 49px; bottom: -50px; right: 20px; transform: rotate(12deg); }
.star-10 { width: 50px; top: -20px; right: -120px; transform: rotate(-8deg); }
/* Reset body layout for natural vertical scrolling */
body {
  min-height: 100vh;
  margin: 0;
  display: flex;
  flex-direction: column; /* Stacks sections vertically */
  align-items: center;
  overflow-x: hidden;
}

/* Hero section containing your card frame and scattered stars */
.hero-section {
  min-height: 100vh;
  width: 100%;
  display: flex;
  justify-content: center;
  align-items: center;
}

/* Cloud section sitting directly below the hero section */
.cloud-section {
  width: 100%;
  position: relative;
  line-height: 0; /* Prevents tiny whitespace gaps under images */
}

.cloud-overlay {
  width: 100%;
  height: auto;
  display: block;
  object-fit: cover;
}
/* Layout container for the section below clouds */
.intro-container {
  padding: 40px 20px 100px; /* INCREASE '100px' TO MAKE IT SCROLL FURTHER */
  display: flex;
  flex-direction: column;
  align-items: center;
}

.intro-heading {
  font-family: "Party LET Plain", "Party LET", "Brush Script MT", cursive;
  font-size: 2.5rem;
  color: #ffffff;
  margin-bottom: 30px;
}

/* Content box pairing text on left and your photo on right */
.intro-content {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 30px;
  max-width: 800px;
  width: 100%;
}

.intro-text {
  font-family: sans-serif;
  color: #ffffff;
  font-size: 1rem;
  line-height: 1.6;
}

/* Your standing photo styling */
.profile-pic {
  width: 220px; /* Adjust image display width */
  height: auto;
}

    h1 {
