/* Twinkling star layer positioned strictly behind the content */
.intro-container::before {
  content: "";
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  z-index: -1; /* Pushes stars behind text */

  /* Pure CSS starfield pattern */
  background-image: 
    radial-gradient(2px 2px at 20px 30px, #ffffff, rgba(0,0,0,0)),
    radial-gradient(2px 2px at 40px 70px, rgba(255,255,255,0.8), rgba(0,0,0,0)),
    radial-gradient(1px 1px at 90px 40px, #ffffff, rgba(0,0,0,0)),
    radial-gradient(2px 2px at 160px 120px, rgba(255,255,255,0.9), rgba(0,0,0,0)),
    radial-gradient(1.5px 1.5px at 230px 10px, #ffffff, rgba(0,0,0,0));
  background-repeat: repeat;
  background-size: 250px 250px;

  /* Only this background layer twinkles now */
  animation: starTwinkle 3s ease-in-out infinite alternate;
}

/* Keyframes target only the background star opacity */
@keyframes starTwinkle {
  0% {
    opacity: 0.2;
  }
  100% {
    opacity: 0.8;
  }
}
/* Animated DBZ / Cosmic Aura Effect for transparent PNGs */
.aura-glow {
  animation: dbzAura 0.8s ease-in-out infinite alternate;
  will-change: filter;
}

@keyframes dbzAura {
  0% {
    filter: 
      drop-shadow(0 0 6px rgba(135, 206, 235, 0.8))
      drop-shadow(0 0 15px rgba(180, 140, 255, 0.6))
      drop-shadow(0 0 25px rgba(135, 206, 235, 0.4));
    transform: scale(1);
  }
  100% {
    filter: 
      drop-shadow(0 0 12px rgba(135, 206, 235, 1))
      drop-shadow(0 0 28px rgba(180, 140, 255, 0.9))
      drop-shadow(0 0 45px rgba(255, 255, 255, 0.7));
    transform: scale(1.015); /* Subtle energy flare expansion */
  }
}
/* Container for the interactive reveal line */
.secret-container {
  margin-top: 15px;
  display: flex;
  align-items: center;
  gap: 12px;
  cursor: pointer;
}

/* Hide the raw checkbox input */
.secret-toggle {
  display: none;
}

/* The celestial prop icon */
.celestial-prop {
  font-size: 7rem;
  transition: transform 0.5s ease, filter 0.5s ease;
  user-select: none;
}

/* Default state: Sun */
.celestial-prop::before {
  content: "☀️";
  filter: drop-shadow(0 0 8px #ffb703);
}

/* Hidden secret text state */
.secret-fact {
  opacity: 0;
  transform: translateX(-15px) scale(0.9);
  font-size: 1.8rem;
  transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  color: #a0c4ff;
  font-weight: bold;
}

/* --- REVEAL TRIGGER (ON CLICK / TAP) --- */

/* 1. Turn Sun into glowing Moon & rotate */
.secret-toggle:checked + .celestial-prop::before {
  content: "🌙";
  filter: drop-shadow(0 0 12px #e0aaff);
}

.secret-toggle:checked + .celestial-prop {
  transform: rotate(360deg) scale(1.2);
}

/* 2. Pop the Batman fact out of nowhere! */
.secret-toggle:checked ~ .secret-fact {
  opacity: 1;
  transform: translateX(0) scale(1);
}
