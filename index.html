<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>WELCOME TO MIA'S PLANET</title>

  <style>
    body {
      background-color: #0b0d17;
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      font-family: sans-serif;
      box-shadow: inset 0 0 90px rgba(180, 140, 255, 0.49);
    }

    .card-container {
      position: relative;

      /* 1. PUT YOUR PURPLE FRAME IMAGE LINK HERE */
      background-image: url('https://i.postimg.cc/nVKyPdh3/IMG-0836.png');
      background-size: 100% 100%;
      background-repeat: no-repeat;
      background-position: center;

      width: 440px;
      height: 320px;
      padding: 60px 45px 40px 55px;
      box-sizing: border-box;
      text-align: center;

      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    .doodle {
      position: absolute;
      pointer-events: none;
    }

    /* Smaller star dimensions & scattered positions */
    .star-1 {
      width: 80px;
      top: 20px;
      left: -110px;
      transform: rotate(-12deg);
    }

    .star-2 {
      width: 49px;
      bottom: 25px;
      left: -40px;
      transform: rotate(8deg);
    }

    .star-3 {
      width: 72px;
      bottom: -45px;
      left: 40px;
      transform: rotate(-5deg);
    }

    .star-4 {
      width: 55px;
      top: -35px;
      right: -50px;
      transform: rotate(15deg);
    }

    .star-5 {
      width: 45px;
      top: 75px;
      right: -110px;
      transform: rotate(-10deg);
    }

    .star-6 {
      width: 80px;
      bottom: -30px;
      right: -70px;
      transform: rotate(20deg);
    }
/* Change sizes here by adjusting the 'width' numbers */
.star-7  { width: 58px; top: -40px; left: 10px; transform: rotate(5deg); }
.star-8  { width: 62px; top: 120px; left: -130px; transform: rotate(-18deg); }
.star-9  { width: 49px; bottom: -50px; right: 20px; transform: rotate(12deg); }
.star-10 { width: 50px; top: -20px; right: -120px; transform: rotate(-8deg); }

    h1 {
      font-family: "Party LET Plain", "Party LET", "Brush Script MT", cursive;
      font-size: 2.2rem;
      color: #ffffff;
      margin: 0 0 10px 0;
      line-height: 1.2;
    }

    p {
      font-family: sans-serif;
      font-size: 0.95rem;
      color: #d1d5db;
      margin: 0;
    }
  </style>
</head>
<body>

  <div class="card-container">
    <!-- 2. STAR DOODLES (IMG-0843.png) -->
    <img src="https://i.postimg.cc/7ZV7FX61/IMG-0843.png" class="doodle star-1" alt="star">
    <img src="https://i.postimg.cc/7ZV7FX61/IMG-0843.png" class="doodle star-2" alt="star">
    <img src="https://i.postimg.cc/7ZV7FX61/IMG-0843.png" class="doodle star-3" alt="star">
    <img src="https://i.postimg.cc/7ZV7FX61/IMG-0843.png" class="doodle star-4" alt="star">
    <img src="https://i.postimg.cc/7ZV7FX61/IMG-0843.png" class="doodle star-5" alt="star">
    <img src="https://i.postimg.cc/7ZV7FX61/IMG-0843.png" class="doodle star-6" alt="star">
<img src="https://i.postimg.cc/7ZV7FX61/IMG-0843.png" class="doodle star-7" alt="star">
<img src="https://i.postimg.cc/7ZV7FX61/IMG-0843.png" class="doodle star-8" alt="star">
<img src="https://i.postimg.cc/7ZV7FX61/IMG-0843.png" class="doodle star-9" alt="star">
<img src="https://i.postimg.cc/7ZV7FX61/IMG-0843.png" class="doodle star-10" alt="star">

    <h1>WELCOME TO MIA'S PLANET</h1>
    <p>~prepare to be starstruck~</p>
  </div>

</body>
</html>
